Form.success.title: 'Richiesta di prestito ricevuta, %name%!'
Form.success.message: >
  Ciao **%name%**,
  <br/><br/>
  Ti ringraziamo per aver inviato la tua richiesta di prestito a **%organization%**.
  La tua pratica è ora in fase di elaborazione.
  <br/><br/>
  Il nostro team specializzato esaminerà attentamente la tua richiesta e ti contatterà
  entro **24-48 ore lavorative** per informarti sullo stato della tua pratica
  o per richiedere ulteriori informazioni se necessario.
  <br/><br/>
  Nel frattempo, puoi consultare le nostre <a href="{{path('home')}}#faq">FAQ</a> per qualsiasi
  domanda frequente o seguirci sui nostri social media per rimanere aggiornato sulle nostre novità.
  <br/><br/>
  Non vediamo l'ora di accompagnarti nella realizzazione dei tuoi progetti.
  <br/><hr/>
  Cordialmente,<br/>
  Il team di **%organization%**

