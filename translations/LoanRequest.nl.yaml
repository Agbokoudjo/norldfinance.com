Form.success.message: >
  Hallo **%name%**,
  <br/><br/>
  Bedankt voor het indienen van uw leningsaanvraag bij **%organization%**.
  Uw aanvraag wordt nu verwerkt.
  <br/><br/>
  Ons gespecialiseerde team zal uw aanvraag zorgvuldig beoordelen en contact met u opnemen
  binnen **24 tot 48 werkuren** om u te informeren over de status van uw aanvraag
  of om indien nodig aanvullende informatie te vragen.
  <br/><br/>
  In de tussentijd kunt u onze <a href="{{path('home')}}#faq">Veelgestelde Vragen</a> raadplegen voor
  veelgestelde vragen of ons volgen op onze sociale media om op de hoogte te blijven van ons nieuws.
  <br/><br/>
  We kijken ernaar uit u te helpen bij het realiseren van uw projecten.
  <br/><hr/>
  Met vriendelijke groet,<br/>
  Het team van **%organization%**

