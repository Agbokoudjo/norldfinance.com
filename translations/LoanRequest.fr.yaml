Form.success.title: 'Demande de prêt reçue, %name% !'
Form.success.message: >
  Bonjour **%name%**,
  <br/><br/>
  Nous vous remercions d'avoir soumis votre demande de prêt à **%organization%**.
  Votre dossier est maintenant en cours de traitement.
  <br/><br/>
  Notre équipe spécialisée étudiera attentivement votre demande et vous contactera
  dans les **24 à 48 heures ouvrables** pour vous informer de la suite donnée à votre dossier
  ou pour demander des informations complémentaires si nécessaire.
  <br/><br/>
  En attendant, vous pouvez consulter notre <a href="{{path('home')}}#faq">FAQ</a> pour toute question
  fréquemment posée ou nous suivre sur nos réseaux sociaux pour rester informé(e) de nos actualités.
  <br/><br/>
  Nous sommes impatients de vous accompagner dans la réalisation de vos projets.
  <br/><hr/>
  Cordialement,<br/>
  L’équipe **%organization%**

