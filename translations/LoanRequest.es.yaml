Form.success.title: 'Solicitud de préstamo recibida, %name%!'
Form.success.message: >
  Hola **%name%**,
  <br/><br/>
  Gracias por enviar su solicitud de préstamo a **%organization%**.
  Su expediente está siendo procesado.
  <br/><br/>
  Nuestro equipo especializado revisará cuidadosamente su solicitud y se pondrá en contacto
  con usted en un plazo de **24 a 48 horas hábiles** para informarle sobre el estado de su expediente
  o para solicitar información adicional si es necesario.
  <br/><br/>
  Mientras tanto, puede consultar nuestras <a href="{{path('home')}}#faq">Preguntas Frecuentes</a> para cualquier
  pregunta frecuente o seguirnos en nuestras redes sociales para mantenerse informado(a) sobre nuestras noticias.
  <br/><br/>
  Esperamos poder acompañarle en la realización de sus proyectos.
  <br/><hr/>
  Atentamente,<br/>
  El equipo de **%organization%**

