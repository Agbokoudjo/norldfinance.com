Form.success.title: 'Kreditantrag erhalten, %name%!'
Form.success.message: >
  Hallo **%name%**,
  <br/><br/>
  Vielen Dank für Ihren Kreditantrag bei **%organization%**.
  Ihr Antrag wird derzeit bearbeitet.
  <br/><br/>
  Unser spezialisiertes Team wird Ihren Antrag sorgfältig prüfen und Sie
  innerhalb von **24 bis 48 Arbeitsstunden** kontaktieren, um Sie über den Status Ihres Antrags
  zu informieren oder bei Bedarf weitere Informationen anzufordern.
  <br/><br/>
  In der Zwischenzeit können Sie unsere <a href="{{path('home')}}#faq">FAQ</a> für häufig gestellte
  Fragen konsultieren oder uns in den sozialen Medien folgen, um über unsere Neuigkeiten auf dem Laufenden zu bleiben.
  <br/><br/>
  Wir freuen uns darauf, Sie bei der Umsetzung Ihrer Projekte zu unterstützen.
  <br/><hr/>
  Mit freundlichen Grüßen,<br/>
  Das Team von **%organization%**

