Form.success.title: 'Pedido de empréstimo recebido, %name%!'
Form.success.message: >
  Olá **%name%**,
  <br/><br/>
  Agradecemos por submeter o seu pedido de empréstimo a **%organization%**.
  O seu processo está agora em fase de tratamento.
  <br/><br/>
  A nossa equipa especializada analisará cuidadosamente o seu pedido e entrará em contacto
  consigo dentro de **24 a 48 horas úteis** para o informar sobre o seguimento do seu processo
  ou para solicitar informações complementares, se necessário.
  <br/><br/>
  Enquanto isso, pode consultar a nossa <a href="{{path('home')}}#faq">FAQ</a> para quaisquer
  perguntas frequentes ou seguir-nos nas nossas redes sociais para se manter informado(a) sobre as nossas notícias.
  <br/><br/>
  Estamos ansiosos para o(a) acompanhar na realização dos seus projetos.
  <br/><hr/>
  Atenciosamente,<br/>
  A equipa **%organization%**

